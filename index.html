<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Assistant - Professional Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #0f1419;
            color: #e5e7eb;
            position: relative;
        }

        .background-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
                #0f1419;
            z-index: 0;
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 1;
            pointer-events: none;
            opacity: 0.5;
        }

        .container {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        header {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.15);
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f9fafb;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.01em;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }

        .status-badge {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #10b981;
            font-weight: 500;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #chat-container::-webkit-scrollbar {
            width: 8px;
        }

        #chat-container::-webkit-scrollbar-track {
            background: rgba(17, 24, 39, 0.4);
            border-radius: 8px;
        }

        #chat-container::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.3);
            border-radius: 8px;
        }

        #chat-container::-webkit-scrollbar-thumb:hover {
            background: rgba(59, 130, 246, 0.5);
        }

        .message {
            max-width: 65%;
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 0.925rem;
            animation: messageSlide 0.3s ease-out;
            position: relative;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #ffffff;
            box-shadow: 0 2px 12px rgba(59, 130, 246, 0.25);
            border: 1px solid rgba(147, 197, 253, 0.2);
        }

        .bot {
            align-self: flex-start;
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(12px);
            color: #e5e7eb;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.15);
        }

        .bot h1, .bot h2, .bot h3 {
            margin: 12px 0 8px;
            font-weight: 600;
            color: #60a5fa;
        }

        .bot h1 {
            font-size: 1.1rem;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
        }

        .bot h2 {
            font-size: 1rem;
        }

        .bot h3 {
            font-size: 0.95rem;
        }

        .bot p {
            margin: 6px 0;
            color: #d1d5db;
            font-size: 0.925rem;
        }

        .bot ul {
            margin: 8px 0 8px 20px;
            padding-left: 0;
            list-style: none;
        }

        .bot li {
            margin: 6px 0;
            padding-left: 20px;
            position: relative;
            color: #d1d5db;
            font-size: 0.925rem;
        }

        .bot li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #3b82f6;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .bot strong {
            color: #f9fafb;
            font-weight: 600;
        }

        .bot em {
            color: #9ca3af;
        }

        .typing {
            align-self: flex-start;
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(12px);
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(59, 130, 246, 0.15);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.875rem;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background: #3b82f6;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out;
        }

        .typing-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes typingBounce {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        #input-area {
            display: flex;
            gap: 12px;
            padding: 16px;
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.15);
            border-radius: 12px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #message-input {
            flex: 1;
            padding: 12px 18px;
            font-size: 0.925rem;
            background: rgba(31, 41, 55, 0.6);
            border: 1px solid rgba(75, 85, 99, 0.5);
            border-radius: 10px;
            outline: none;
            color: #f9fafb;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        #message-input::placeholder {
            color: #6b7280;
        }

        #message-input:focus {
            border-color: #3b82f6;
            background: rgba(31, 41, 55, 0.8);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        #send-button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.925rem;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
            font-family: 'Inter', sans-serif;
        }

        #send-button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        #send-button:active:not(:disabled) {
            transform: translateY(0);
        }

        #send-button:disabled {
            background: rgba(75, 85, 99, 0.5);
            cursor: not-allowed;
            box-shadow: none;
        }

        .welcome {
            align-self: center;
            text-align: center;
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(12px);
            padding: 32px;
            border-radius: 16px;
            border: 1px solid rgba(59, 130, 246, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 580px;
            animation: welcomeAppear 0.6s ease-out;
        }

        @keyframes welcomeAppear {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .welcome h2 {
            color: #f9fafb;
            margin-bottom: 12px;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .welcome p {
            color: #9ca3af;
            line-height: 1.6;
            margin-bottom: 10px;
            font-size: 0.925rem;
        }

        .welcome .subtitle {
            margin-top: 20px;
            color: #6b7280;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
        }

        .welcome .example, .example-btn {
            display: inline-block;
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            margin: 6px;
            font-size: 0.85rem;
            color: #60a5fa;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .welcome .example:hover, .example-btn:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .example-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.15);
        }

        .error {
            border-color: rgba(239, 68, 68, 0.3) !important;
            box-shadow: 0 2px 12px rgba(239, 68, 68, 0.2) !important;
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            header {
                padding: 12px 16px;
            }

            header h1 {
                font-size: 1.1rem;
            }

            .status-badge {
                display: none;
            }

            .message {
                max-width: 80%;
                font-size: 0.9rem;
            }

            #input-area {
                padding: 12px;
            }

            #send-button {
                padding: 12px 20px;
            }

            .welcome {
                padding: 24px;
            }

            .welcome h2 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="background-3d"></div>
    <div class="grid-overlay"></div>

    <div class="container">
        <header>
            <h1>
                <div class="logo-icon">📊</div>
                Stock Market Assistant
                <div class="status-badge">
                    <span class="status-dot"></span>
                    LIVE
                </div>
            </h1>
        </header>

        <div id="chat-container">
            <div class="welcome">
                <h2>Financial Intelligence Dashboard</h2>
                <p>Professional stock analysis with real-time market data, comprehensive fundamentals, and latest financial news.</p>
                <p class="subtitle">Quick Actions</p>
                <div style="margin-top: 12px;">
                    <button class="example-btn" onclick="fillAndFocus('Analyze AAPL')">Analyze AAPL</button>
                    <button class="example-btn" onclick="fillAndFocus('TSLA price update')">TSLA price update</button>
                    <button class="example-btn" onclick="fillAndFocus('NVDA fundamentals')">NVDA fundamentals</button>
                    <button class="example-btn" onclick="fillAndFocus('Market news')">Market news</button>
                </div>
            </div>
        </div>

        <div id="input-area">
            <input type="text" id="message-input" placeholder="Enter stock ticker or query..." autocomplete="off">
            <button id="send-button">Send</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');

        // Function to fill input and focus
        function fillAndFocus(text) {
            messageInput.value = text;
            messageInput.focus();
        }

        // Make it globally accessible
        window.fillAndFocus = fillAndFocus;

        function inlineMarkdown(text) {
            let t = text;
            t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            t = t.replace(/\*(.+?)\*/g, '<em>$1</em>');
            return t;
        }

        function renderMarkdown(text) {
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            function closeList() {
                if (inList) {
                    html += '</ul>';
                    inList = false;
                }
            }

            for (let rawLine of lines) {
                const line = rawLine.replace(/\r/g, '');
                const trimmed = line.trim();

                if (trimmed === '') {
                    closeList();
                    continue;
                }

                if (/^###\s+/.test(trimmed)) {
                    closeList();
                    const content = trimmed.replace(/^###\s+/, '');
                    html += `<h3>${inlineMarkdown(content)}</h3>`;
                    continue;
                }
                if (/^##\s+/.test(trimmed)) {
                    closeList();
                    const content = trimmed.replace(/^##\s+/, '');
                    html += `<h2>${inlineMarkdown(content)}</h2>`;
                    continue;
                }
                if (/^#\s+/.test(trimmed)) {
                    closeList();
                    const content = trimmed.replace(/^#\s+/, '');
                    html += `<h1>${inlineMarkdown(content)}</h1>`;
                    continue;
                }

                if (/^[-*]\s+/.test(trimmed)) {
                    const item = trimmed.replace(/^[-*]\s+/, '');
                    if (!inList) {
                        html += '<ul>';
                        inList = true;
                    }
                    html += `<li>${inlineMarkdown(item)}</li>`;
                    continue;
                }

                closeList();
                html += `<p>${inlineMarkdown(trimmed)}</p>`;
            }

            closeList();
            return html;
        }

        function addMessage(text, type, isError = false) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', type);
            if (isError) msgDiv.classList.add('error');

            if (type === 'bot') {
                msgDiv.innerHTML = renderMarkdown(text);
            } else {
                msgDiv.textContent = text;
            }

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.classList.add('typing');
            typingDiv.id = 'typing-indicator';
            typingDiv.innerHTML = `
                <span style="color: #9ca3af;">Processing</span>
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return typingDiv;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) indicator.remove();
        }

        function getAnswerFromResponse(data) {
            if (!data) return 'Empty response from server.';
            if (typeof data.answer === 'string' && data.answer.trim() !== '') {
                return data.answer;
            }
            if (typeof data.error === 'string') {
                return 'Server error: ' + data.error;
            }
            return 'Unexpected response: ' + JSON.stringify(data);
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            const welcome = document.querySelector('.welcome');
            if (welcome) welcome.remove();

            addMessage(text, 'user');
            messageInput.value = '';
            sendButton.disabled = true;

            addTypingIndicator();

            try {
                const response = await fetch('http://127.0.0.1:8000/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: text })
                });

                removeTypingIndicator();

                if (!response.ok) {
                    const errorText = await response.text().catch(() => '');
                    throw new Error(`HTTP ${response.status}: ${errorText || 'Server error'}`);
                }

                const data = await response.json();
                const answer = getAnswerFromResponse(data);
                
                const isError = answer.toLowerCase().includes('error') || 
                               answer.toLowerCase().includes('exceeded') ||
                               answer.toLowerCase().includes('rate limit');
                
                addMessage(answer, 'bot', isError);
            } catch (error) {
                removeTypingIndicator();
                console.error('Chat error:', error);
                addMessage('⚠️ Connection error. Please verify the backend server is running on http://127.0.0.1:8000', 'bot', true);
            } finally {
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        window.addEventListener('load', () => {
            messageInput.focus();
        });
    </script>
</body>
</html>
